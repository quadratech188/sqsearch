[package]
name = "sqsearch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.59", features = ["derive"] }
env_logger = "0.11.9"
libc = "0.2.181"
log = "0.4.29"
rusqlite = { version = "0.40", features = ["load_extension", "vtab"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
toml = "1.1.6"
walkdir = "2.5.0"
